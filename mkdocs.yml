site_name: JM Framework
site_description: Official handbook for JM Framework and the Misfits Arma 3 community
site_url: https://jamio.github.io/JM_Framework_Docs/
repo_url: https://github.com/Jamio/JM_Framework_Docs
repo_name: Jamio/JM_Framework_Docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: jmf-light
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md

  - Welcome:
      - Welcome to the Misfits: players/welcome/about.md
      - Joining the Community: players/welcome/joining.md
      - Welcome to the Framework: welcome/framework.md

  - Player Guide:
      - Start Here: players/index.md
      - Joining an Operation:
          - Attendance: players/before/operations.md
          - Mods: players/before/mods.md
          - Briefings: players/before/briefings.md
      - Basics: players/basics.md
      - In-Game Briefing: players/in-game-briefing.md
      - Roles and Gear: players/before/roles.md
      - Respawning: players/respawning.md
      - Redeployment: players/redeployment.md
      - Vehicles and Garage: players/vehicles-garage.md
      - ACE3:
          - General: players/during/ace.md
          - Medical: players/during/ace-medical.md
      - TFAR:
          - Setup: players/during/tfar-setup.md
          - Usage: players/during/tfar.md

  - Mission Making:
      - Start Here: mission-makers/index.md
      - Mission Setup and Design:
          - Basic Mission Setup: mission-makers/concept/basic-setup.md
          - Design Philosophy: mission-makers/design-philosophy.md
      - Framework Components:
          - Framework Overview: mission-makers/framework/index.md
          - Install and Core Setup: mission-makers/framework/core-setup.md
          - Component Catalogue: components/index.md
          - Aid Station: components/aid-station.md
          - Rally Points: components/rally-points.md
          - Redeployment: components/redeployment.md
          - Garage: components/garage.md
          - Vehicle Support: components/vehicle-support.md
          - Arsenal and Loadouts: components/arsenal-loadouts.md
          - Tickets and Respawn: components/tickets-respawn.md
          - Logistics and FOBs: components/logistics-fobs.md
          - Safezones and AO Limits: components/safezones-ao.md
          - Civilian Interaction: components/civilian-interaction.md
          - Mission Administration: components/mission-administration.md

  - Framework Development:
      - Start Here: technical/index.md
      - Developer Notes:
          - Returning to the Project: technical/quick-reference.md
          - Architecture: technical/architecture.md
          - Configuration: technical/configuration.md
          - Compatibility: technical/compatibility.md
          - Events and API: technical/events-api.md
          - Testing and Debugging: technical/troubleshooting.md
      - Component Architecture:
          - Function and Event Maps: technical/component-flows.md
      - Project:
          - Changelog: development/changelog.md
          - Roadmap: development/roadmap.md
          - Contributing: contributing.md

