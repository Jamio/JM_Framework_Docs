site_name: JM Framework
site_description: Official handbook for JM Framework and the Misfits Arma 3 community
site_url: https://jamio.github.io/JM_Framework_Docs/
repo_url: https://github.com/Jamio/JM_Framework_Docs
repo_name: Jamio/JM_Framework_Docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: jmf-light
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md

  - Player Guide:
      - Start Here: players/index.md
      - Before the Operation:
          - Join the Community: players/getting-started.md
          - Prepare for a Mission: community/index.md
          - Briefings and Roles: community/roles.md
      - In Game:
          - ACE and Keybinds: players/interactions.md
          - Medical: community/ace-medical.md
          - TFAR: community/tfar.md
          - Framework Systems: components/index.md

  - Mission Making:
      - Start Here: mission-makers/index.md
      - Getting Started:
          - Install and Set Up: mission-makers/getting-started.md
          - Build Your First Mission: mission-makers/first-mission.md
          - Eden Modules: mission-makers/eden.md
          - Sides and TvT: mission-makers/side-aware.md
      - Components: components/index.md
      - Zeus:
          - Overview: zeus/index.md
          - ZEN Modules: zeus/zen-modules.md
          - Troubleshooting: zeus/troubleshooting.md

  - Development:
      - Start Here: technical/index.md
      - Design:
          - Philosophy and Architecture: technical/architecture.md
          - Configuration: technical/configuration.md
          - Compatibility: technical/compatibility.md
      - Reference:
          - Events and API: technical/events-api.md
          - Troubleshooting: technical/troubleshooting.md
      - Project:
          - Changelog: development/changelog.md
          - Roadmap: development/roadmap.md
          - Contributing: contributing.md

copyright: Copyright &copy; JM Framework contributors
