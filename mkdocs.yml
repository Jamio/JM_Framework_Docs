site_name: JM Framework
site_description: Official handbook for JM Framework and the Misfits Arma 3 community
site_url: https://jamio.github.io/JM_Framework_Docs/
repo_url: https://github.com/Jamio/JM_Framework_Docs
repo_name: Jamio/JM_Framework_Docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: jmf-light
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md

  - Player Guide:
      - Start Here: players/index.md
      - Welcome to the Misfits:
          - About Our Community: players/welcome/about.md
          - What We Expect: players/welcome/expectations.md
          - Joining the Community: players/welcome/joining.md
      - Before the Operation:
          - Operations and Scheduling: players/before/operations.md
          - Setting Up Your Mods: players/before/mods.md
          - Mission Briefings: players/before/briefings.md
          - Choosing a Role: players/before/roles.md
      - During the Operation:
          - Teamwork and Communication: players/during/teamwork.md
          - Keybinds and Controls: players/during/keybinds.md
          - Using ACE: players/during/ace.md
          - ACE Medical: players/during/ace-medical.md
          - Using TFAR: players/during/tfar.md
          - JM Framework Systems: players/during/framework-systems.md
      - After the Operation:
          - Debriefing: players/after/debriefing.md
          - Feedback and Media: players/after/feedback-media.md

  - Mission Making:
      - Start Here: mission-makers/index.md
      - Mission Concept:
          - Start with the Idea: mission-makers/concept/index.md
          - Common Pitfalls: mission-makers/concept/pitfalls.md
          - Basic Mission Setup: mission-makers/concept/basic-setup.md
      - Mission Design:
          - Design the Operation: mission-makers/design/index.md
          - Context and Briefing: mission-makers/design/context-briefing.md
          - Objectives and Flow: mission-makers/design/objectives-flow.md
          - Player Roles and Loadouts: mission-makers/design/players-loadouts.md
          - Opposition and Challenge: mission-makers/design/opposition.md
          - Win, Fail, and End Conditions: mission-makers/design/outcomes.md
      - JM Framework:
          - Framework Overview: mission-makers/framework/index.md
          - Install and Core Setup: mission-makers/framework/core-setup.md
          - Component Catalogue: components/index.md
      - Testing and Validation:
          - Testing Overview: mission-makers/testing/index.md
          - Local and Editor Testing: mission-makers/testing/local.md
          - Multiplayer and Server: mission-makers/testing/server.md
          - Final Checklist: mission-makers/testing/checklist.md

  - Development:
      - Start Here: technical/index.md
      - Design:
          - Philosophy and Architecture: technical/architecture.md
          - Configuration: technical/configuration.md
          - Compatibility: technical/compatibility.md
      - Reference:
          - Events and API: technical/events-api.md
          - Troubleshooting: technical/troubleshooting.md
      - Project:
          - Changelog: development/changelog.md
          - Roadmap: development/roadmap.md
          - Contributing: contributing.md

