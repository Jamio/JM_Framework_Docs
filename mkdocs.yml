site_name: JM Framework
site_description: Mission-maker and developer documentation for JM Framework
site_url: https://jamio.github.io/JM_Framework_Docs/
repo_url: https://github.com/Jamio/JM_Framework
repo_name: Jamio/JM_Framework
edit_uri: ""

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: jmf-light
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Dependencies: getting-started/dependencies.md
      - Build Your First Mission: getting-started/first-mission.md
  - Component Guides:
      - Catalogue: components/index.md
      - Foundation:
          - Core and UI: components/foundation/core.md
          - Optional Systems: components/foundation/optional-systems.md
      - Presentation:
          - Briefing: components/presentation/briefing.md
          - Cutscenes: components/presentation/cutscenes.md
          - Debriefing: components/presentation/debriefing.md
          - Intel: components/presentation/intel.md
      - Player Lifecycle:
          - Player Lifecycle: components/lifecycle/player-lifecycle.md
          - Identities and Death Camera: components/lifecycle/identities-death-camera.md
          - Medical: components/lifecycle/medical.md
          - Tickets: components/lifecycle/tickets.md
          - Permadeath: components/lifecycle/permadeath.md
          - Player Statistics: components/lifecycle/player-stats.md
      - Logistics and Movement:
          - Arsenal and Roles: components/logistics/arsenal-roles.md
          - Supply: components/logistics/supply.md
          - Garage: components/logistics/garage.md
          - Fortify: components/logistics/fortify.md
          - Rally Points: components/logistics/rally-points.md
          - Redeployment: components/logistics/redeployment.md
          - Aid Stations: components/logistics/aid-stations.md
      - Gameplay and QoL:
          - CBRN: components/gameplay/cbrn.md
          - Minigames: components/gameplay/minigames.md
          - Forestry: components/gameplay/forestry.md
          - Nametags: components/gameplay/nametags.md
          - Unknown Weapons: components/gameplay/unknown-weapons.md
      - Mission Administration:
          - Tasks: components/administration/tasks.md
          - JTAC: components/administration/jtac.md
          - Sound Player: components/administration/sound-player.md
          - Private Messages: components/administration/private-messages.md
          - Zeus Tools: components/administration/zeus-tools.md
  - Zeus Guide:
      - Overview: zeus/index.md
  - Reference:
      - Configuration Files: reference/configuration.md
      - Public API: reference/public-api.md
      - Mission Validator: reference/mission-validator.md
      - Troubleshooting: reference/troubleshooting.md
  - Development:
      - Architecture: development/architecture.md
      - Locality and JIP: development/locality-jip.md
      - Component Page Template: development/component-page-template.md
      - Contributing: development/contributing.md
      - Changelog: development/changelog.md

